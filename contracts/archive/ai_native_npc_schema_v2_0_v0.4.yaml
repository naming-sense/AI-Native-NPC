target_slots:
  regular_slots: 16
  no_target_slot: 16
  total_slots: 17
  quota:
    Entity: 8
    SoundEvent: 2
    CoverSlot: 2
    SmartObject: 1
    PositionLike: 3
  position_like_kinds:
  - LastKnownPosition
  - Waypoint
  - WorldPosition
  handle_equality:
    identity_key: Kind + StableId(uint64) + Generation(uint32)
    snapshot_key: IdentityKey + Revision(uint64)
    slot_dedupe_and_hysteresis: IdentityKey
    candidate_hash_and_commit_validation: SnapshotKey
candidate_layout:
  count: 272
  formula: candidate_index = skill_id * 17 + target_slot; skill_id = floor(candidate_index / 17)
  continue_semantics: Exactly one ContinueCurrentAction candidate may be valid. The duplicate running Skill/Target candidate
    is masked while running.
tensors:
