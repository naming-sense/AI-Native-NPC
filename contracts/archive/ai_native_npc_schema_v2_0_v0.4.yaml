  candidate_set_hash: SHA-256 over discrete canonical bytes only; raw floats are excluded
  candidate_mask_bits: 272 bits, LSB-first within each byte, 34 bytes
  decision_contract_hash: SHA-256 over schema/model/normalization/skill-registry/slotter/postprocess/calibration asset hashes
  target_handle_bytes: kind uint8 + stable_id uint64 LE + generation uint32 LE + revision uint64 LE
parity:
  discrete_and_hash_inputs: byte-identical
  float_feature_abs_tolerance: 1.0e-06
  float_feature_rel_tolerance: 1.0e-05
  fp32_model_output_abs_tolerance: 0.0001
  fp32_model_output_rel_tolerance: 0.0001
