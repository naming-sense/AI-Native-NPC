registry:
  name: ai_native_npc_goal_registry
  version: 1.0.0
  schema_version: 2.0.0
  contract_revision: 2.0.0-rc1
states:
- Inactive
- Active
- Suspended
- Succeeded
- Failed
- Aborted
arbitration:
  max_active_goals: 1
  max_suspended_goals: 8
  selection_key:
  - field: priority
    direction: desc
    dtype: uint8
  - field: source_priority
    direction: desc
    dtype: uint8
  - field: created_time_quantized_ms
    direction: asc
    dtype: uint64
  - field: goal_instance_id
    direction: asc
    dtype: uint64
  preemption_margin: 50
  interruptibility_modes:
  - Always
  - PhaseBoundary
  - EmergencyOnly
  - Never
  resume_policies:
  - ResumeSamePhase
  - RestartPhase
  - AbortOnPreempt
  on_new_goal_activation_failure: keep_previous_active_goal
  terminal_goal_reactivation: false
  suspended_resume_order: same_selection_key
revision_contract:
  type: uint64_monotonic_per_npc
  increase_on:
  - active_goal_changed
  - goal_suspended
  - goal_resumed
  - goal_aborted
  - phase_changed
  - authoritative_primary_target_changed
  - allowed_skill_set_changed
  - forbidden_skill_set_changed
  - deadline_contract_changed
  do_not_increase_on:
  - progress_value_changed
  - per_frame_timer_changed
  - belief_revision_changed_without_goal_contract_change
  - event_buffer_append
goal_types:
- id: 0
  name: None
- id: 1
  name: IdleObserve
- id: 2
  name: InvestigateDisturbance
- id: 3
  name: EnforceBoundary
- id: 4
  name: CombatEngage
- id: 5
  name: Disengage
- id: 6
  name: Escort
- id: 7
  name: Reserved
goal_phases:
- id: 0
  name: None
- id: 1
  name: Observe
- id: 2
  name: Orient
- id: 3
  name: Navigate
- id: 4
  name: Interact
- id: 5
  name: Search
- id: 6
  name: Resolve
- id: 7
  name: Return
source_priorities:
- id: 0
  name: Routine
- id: 1
  name: Social
- id: 2
  name: Combat
- id: 3
  name: Quest
- id: 4
  name: Emergency
goals:
- id: 1
  name: IdleObserve
  default_priority: 10
  source_priority: Routine
  interruptibility: Always
  resume_policy: ResumeSamePhase
  initial_phase: Observe
  phases:
    Observe:
      allowed_skills:
      - Idle
      - ContinueCurrentAction
      - LookAt
      - TurnTo
      - Greet
      transitions:
      - order: 0
        event: SoundHeard
        guard: valid_disturbance_target
        to_goal: InvestigateDisturbance
        effect: request_new_goal
      - order: 1
        event: SightAcquired
        guard: social_subject
        to_phase: Observe
        effect: remain_and_replan
- id: 2
  name: InvestigateDisturbance
  default_priority: 120
  source_priority: Social
  interruptibility: PhaseBoundary
  resume_policy: ResumeSamePhase
  initial_phase: Orient
  phases:
    Orient:
      allowed_skills:
      - ContinueCurrentAction
      - LookAt
      - TurnTo
      transitions:
      - order: 0
        event: SkillSucceeded
        guard: orientation_complete
        to_phase: Navigate
      - order: 1
        event: TargetInvalidated
        guard: no_valid_snapshot
        terminal: Failed
      - order: 2
        event: Timeout
        guard: phase_timeout
        terminal: Failed
    Navigate:
      allowed_skills:
      - ContinueCurrentAction
      - Approach
      - Investigate
      - Flee
      transitions:
      - order: 0
        event: SkillSucceeded
        guard: arrived_at_snapshot
        to_phase: Search
      - order: 1
        event: SkillFailed
        guard: PathUnavailable
        terminal: Failed
      - order: 2
        event: SightAcquired
        guard: subject_identified
        to_phase: Resolve
      - order: 3
        event: Timeout
        guard: phase_timeout
        terminal: Failed
    Search:
      allowed_skills:
      - ContinueCurrentAction
      - SearchArea
      - LookAt
      - TurnTo
      transitions:
      - order: 0
        event: SightAcquired
        guard: subject_identified
        to_phase: Resolve
      - order: 1
        event: SkillSucceeded
        guard: search_budget_exhausted
        to_phase: Return
      - order: 2
        event: Timeout
        guard: phase_timeout
        to_phase: Return
    Resolve:
      allowed_skills:
      - ContinueCurrentAction
      - Greet
      - Warn
      - CallForHelp
      - Attack
      - Flee
      transitions:
      - order: 0
        event: SkillSucceeded
        guard: resolution_complete
        to_phase: Return
      - order: 1
        event: TargetInvalidated
        guard: no_valid_belief
        to_phase: Search
    Return:
      allowed_skills:
      - ContinueCurrentAction
      - Approach
      - Idle
      transitions:
      - order: 0
        event: SkillSucceeded
        guard: at_return_target
        terminal: Succeeded
      - order: 1
        event: SkillFailed
        guard: PathUnavailable
        terminal: Failed
- id: 3
  name: EnforceBoundary
  status: declared_not_phase0
- id: 4
  name: CombatEngage
  status: declared_not_phase0
- id: 5
  name: Disengage
  status: declared_not_phase0
- id: 6
  name: Escort
  status: declared_not_phase0
- id: 7
  name: Reserved
  status: reserved
