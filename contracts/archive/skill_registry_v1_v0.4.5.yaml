  requires_resource: false
  can_continue_contract:
    delegate: skill.CanContinue
  parameters:
  - slot: 0
    name: duration
    active: 1
    unit: second
    min: 0.5
    max: 5.0
    default: 1.0
    decode: linear
    commit_clamp: true
  - slot: 1
    name: speed
    active: 0
    unit: none
    min: 0.0
    max: 0.0
    default: 0.0
    decode: linear
    commit_clamp: true
  - slot: 2
