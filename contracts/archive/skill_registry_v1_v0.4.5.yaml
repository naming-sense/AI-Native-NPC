registry:
  name: ai_native_npc_skill_registry
  version: 1.0.0
  schema_version: 2.0.0
  contract_revision: 2.0.0-rc4
  parameter_slot_count: 4
parameter_output:
  dtype: float32
  activation: sigmoid
  normalized_range:
  - 0.0
  - 1.0
  decode_formula: min + normalized * (max - min)
  inactive_policy: ignore_output_and_use_default
  commit_policy: server_decode_then_clamp
target_commit_policies:
  Entity:
    mode: latest_valid_belief
    identity_generation_must_match: true
    requested_revision_policy: newer_valid_belief_allowed
    requires_current_perception_when_skill_requires_tracking: true
  SoundEvent:
    mode: immutable_snapshot_exact
    snapshot_revision: exact
    ttl_required: true
  LastKnownPosition:
    mode: immutable_snapshot_exact
    snapshot_revision: exact
    ttl_required: true
    origin_actor_lookup_for_tactical_update: false
  CoverSlot:
    mode: resource_compare_and_swap
    compare:
    - stable_id
    - generation
    - availability_revision
    reservation_id_created_at_commit: true
  SmartObject:
    mode: resource_compare_and_swap
    compare:
    - stable_id
    - generation
    - availability_revision
    reservation_id_created_at_commit: true
  Waypoint:
    mode: immutable_or_authoritative_definition
    snapshot_revision: exact
  WorldPosition:
    mode: immutable_snapshot_exact
    snapshot_revision: exact
    ttl_required_if_configured: true
  NoTarget:
    mode: none
failure_taxonomy:
- TargetInvalid
- TargetGenerationChanged
- PreconditionChanged
- GoalChanged
- PathUnavailable
- ReservationConflict
- Interrupted
- TimedOut
- AuthorityRejected
- ExecutionError
- CancelledByNewDecision
- ContractMismatch
