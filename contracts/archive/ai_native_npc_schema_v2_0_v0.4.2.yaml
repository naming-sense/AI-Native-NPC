runtime_handle_contract:
  model_input: false
  fields:
  - name: kind
    dtype: uint8
  - name: stable_id
    dtype: uint64
  - name: generation
    dtype: uint32
  - name: revision
    dtype: uint64
  identity_key:
  - kind
  - stable_id
  - generation
  snapshot_key:
  - kind
  - stable_id
  - generation
  - revision
  dedupe_key: identity_key
  candidate_hash_key: snapshot_key
  model_feature_exclusions:
  - stable_id
  - generation
  - revision
  - event_id
  - slot_id
  - waypoint_id
  - reservation_id
  - created_world_time
  - absolute_world_position
target_slots:
  regular_slots: 16
  no_target_slot: 16
  total_slots: 17
  quota:
    Entity: 8
    SoundEvent: 2
    CoverSlot: 2
    SmartObject: 1
    PositionLike: 3
  position_like_kinds:
  - LastKnownPosition
  - Waypoint
  - WorldPosition
  mandatory_preserve_order:
  - rank: 0
    source: current_skill_target
    max_count: 1
  - rank: 1
    source: active_goal_primary_target
    max_count: 1
  - rank: 2
    source: active_dialogue_target
    max_count: 1
  - rank: 3
    source: reserved_resource
    max_count: 2
  - rank: 4
    source: recent_attacker
    max_count: 2
  - rank: 5
    source: active_goal_secondary_target
    max_count: 2
  mandatory_overflow:
    threshold: 16
    action: abstain_and_goal_fallback
    critical_failure: true
  quantization:
    rounding: half_away_from_zero
    confidence:
      input_min: 0.0
      input_max: 1.0
      scale_ref: slotter_confidence_scale
      dtype: uint16
    age_seconds:
      input_min: 0.0
      input_max_ref: target_age_max_s
      scale_ref: slotter_age_centisecond_scale
      dtype: uint16
    distance_cm:
      input_min: 0.0
      input_max_ref: spatial_max_cm
      bin_size_ref: slotter_distance_bin_cm
      dtype: uint16
    loudness:
      input_min: 0.0
      input_max: 1.0
      scale_ref: slotter_loudness_scale
      dtype: uint16
  category_sort_keys:
    Entity:
    - field: visible_now
      direction: desc
      encoding: boolean
    - field: confidence
      direction: desc
      encoding: confidence
    - field: age_seconds
      direction: asc
      encoding: age_seconds
    - field: distance_cm
      direction: asc
      encoding: distance_cm
    - field: canonical_handle_bytes
      direction: asc
      encoding: bytes
    SoundEvent:
    - field: event_priority
      direction: desc
      encoding: uint8
    - field: confidence
      direction: desc
      encoding: confidence
    - field: age_seconds
      direction: asc
      encoding: age_seconds
    - field: loudness
      direction: desc
      encoding: loudness
    - field: canonical_handle_bytes
      direction: asc
      encoding: bytes
    CoverSlot:
    - field: availability
      direction: desc
      encoding: boolean
    - field: resource_generation_valid
      direction: desc
      encoding: boolean
    - field: path_reachable
      direction: desc
      encoding: boolean
    - field: distance_cm
      direction: asc
      encoding: distance_cm
    - field: canonical_handle_bytes
      direction: asc
      encoding: bytes
    SmartObject:
    - field: availability
      direction: desc
      encoding: boolean
    - field: resource_generation_valid
      direction: desc
      encoding: boolean
    - field: distance_cm
      direction: asc
      encoding: distance_cm
    - field: canonical_handle_bytes
      direction: asc
      encoding: bytes
    PositionLike:
    - field: goal_owned
      direction: desc
      encoding: boolean
    - field: confidence
      direction: desc
      encoding: confidence
    - field: age_seconds
      direction: asc
      encoding: age_seconds
    - field: distance_cm
      direction: asc
      encoding: distance_cm
    - field: kind
      direction: asc
      encoding: uint8
    - field: canonical_handle_bytes
      direction: asc
      encoding: bytes
  overflow_round_robin:
  - Entity
  - SoundEvent
  - CoverSlot
  - SmartObject
  - PositionLike
  slot_hysteresis:
    selection_affected: false
    retain_by: identity_key
    new_target_order:
    - mandatory_rank
    - category_order
    - category_sort_key
    assign_to: lowest_free_regular_slot
candidate_layout:
  count: 272
  order: skill_major_target_minor
  skill_stride_ref: total_target_slots
  candidate_index_fields:
  - skill_id
  - target_slot
  continue_control:
    skill_id: 1
    executable_skill: false
    exactly_one_valid_when_running: true
    requires_can_continue_latest_belief: true
    duplicate_running_skill_target_candidate: masked
    current_skill_one_hot_index_17: reserved_zero
score_contract:
  query:
    projection_dim: 64
    layer_norm: true
    l2_normalize: true
  key:
    dimension: 64
    layer_norm: true
    l2_normalize: true
  cosine_temperature: 0.5
  skill_bias_clamp:
  - -0.25
  - 0.25
  target_kind_bias_clamp:
  - -0.25
  - 0.25
  raw_score_clamp:
  - -2.5
  - 2.5
  formula: clamp(cosine(q,key)/temperature + skill_bias + target_kind_bias, raw_min, raw_max)
  switch_cost:
    min: 0.0
    max: 1.0
    lambda: 1.0
    terms:
    - name: skill_changed
      weight: 0.45
    - name: target_changed
      weight: 0.25
    - name: before_min_duration
      weight: 0.2
    - name: release_or_transfer_reservation
      weight: 0.1
  adjusted_score_formula: raw_score - lambda * switch_cost
  masked_softmax:
    temperature: 1.0
    invalid_value: negative_infinity
    entropy_normalization: divide_by_log_valid_count_when_count_gt_1
contract_mismatch_policy:
  schema_or_registry_or_version_mismatch: hard_reject_before_feature_build_or_inference
  response_hash_mismatch: discard_response
  ood_scope: valid_contract_inputs_only
commit_validation:
  Entity:
    mode: latest_valid_belief
    identity_generation_must_match: true
    requested_revision_policy: newer_valid_belief_allowed
    requires_current_perception_when_skill_requires_tracking: true
  SoundEvent:
    mode: immutable_snapshot_exact
    snapshot_revision: exact
    ttl_required: true
  LastKnownPosition:
    mode: immutable_snapshot_exact
    snapshot_revision: exact
    ttl_required: true
    origin_actor_lookup_for_tactical_update: false
  CoverSlot:
    mode: resource_compare_and_swap
    compare:
    - stable_id
    - generation
    - availability_revision
    reservation_id_created_at_commit: true
  SmartObject:
    mode: resource_compare_and_swap
    compare:
    - stable_id
    - generation
    - availability_revision
    reservation_id_created_at_commit: true
  Waypoint:
    mode: immutable_or_authoritative_definition
    snapshot_revision: exact
  WorldPosition:
    mode: immutable_snapshot_exact
    snapshot_revision: exact
    ttl_required_if_configured: true
  NoTarget:
    mode: none
