registry:
  name: ai_native_npc_goal_registry
  version: 1.0.1
  schema_version: 2.0.0
  contract_revision: 2.0.0-rc2
states:
- Inactive
- Active
- Suspended
- Succeeded
- Failed
- Aborted
arbitration:
  max_active_goals: 1
  max_suspended_goals: 8
  selection_key:
  - field: priority
    direction: desc
    dtype: uint8
  - field: source_priority
    direction: desc
    dtype: uint8
  - field: created_time_quantized_ms
    direction: asc
    dtype: uint64
  - field: goal_instance_id
    direction: asc
    dtype: uint64
  preemption_margin: 50
  interruptibility_modes:
  - Always
  - PhaseBoundary
  - EmergencyOnly
  - Never
  resume_policies:
  - ResumeSamePhase
  - RestartPhase
  - AbortOnPreempt
  on_new_goal_activation_failure: keep_previous_active_goal
  terminal_goal_reactivation: false
  suspended_resume_order: same_selection_key
revision_contract:
  type: uint64_monotonic_per_npc
  increase_on:
  - active_goal_changed
  - goal_suspended
  - goal_resumed
  - goal_aborted
  - phase_changed
  - authoritative_primary_target_changed
  - allowed_skill_set_changed
  - forbidden_skill_set_changed
  - deadline_contract_changed
  do_not_increase_on:
  - progress_value_changed
  - per_frame_timer_changed
  - belief_revision_changed_without_goal_contract_change
  - event_buffer_append
goal_types:
- id: 0
  name: None
- id: 1
  name: IdleObserve
- id: 2
  name: InvestigateDisturbance
- id: 3
  name: EnforceBoundary
- id: 4
  name: CombatEngage
- id: 5
  name: Disengage
- id: 6
  name: Escort
- id: 7
  name: Reserved
goal_phases:
- id: 0
  name: None
- id: 1
  name: Observe
- id: 2
  name: Orient
- id: 3
  name: Navigate
- id: 4
  name: Interact
- id: 5
  name: Search
- id: 6
  name: Resolve
- id: 7
  name: Return
source_priorities:
- id: 0
  name: Routine
- id: 1
  name: Social
- id: 2
  name: Combat
- id: 3
  name: Quest
- id: 4
  name: Emergency
goals:
- id: 1
  name: IdleObserve
  default_priority: 10
  source_priority: Routine
  interruptibility: Always
  resume_policy: ResumeSamePhase
  initial_phase: Observe
  phases:
    Observe:
      allowed_skills:
      - Idle
      - ContinueCurrentAction
      - LookAt
      - TurnTo
      - Greet
      transitions:
      - order: 0
        event: SoundHeard
        guard: valid_disturbance_target
        to_goal: InvestigateDisturbance
        effect: request_new_goal
      - order: 1
        event: SightAcquired
        guard: social_subject
        to_phase: Observe
        effect: remain_and_replan
- id: 2
  name: InvestigateDisturbance
  default_priority: 120
  source_priority: Social
  interruptibility: PhaseBoundary
  resume_policy: ResumeSamePhase
  initial_phase: Orient
  phases:
    Orient:
      allowed_skills:
      - ContinueCurrentAction
      - LookAt
      - TurnTo
      transitions:
      - order: 0
        event: SkillSucceeded
        guard: orientation_complete
        to_phase: Navigate
      - order: 1
        event: TargetInvalidated
        guard: no_valid_snapshot
        terminal: Failed
      - order: 2
        event: Timeout
        guard: phase_timeout
        terminal: Failed
    Navigate:
      allowed_skills:
      - ContinueCurrentAction
      - Approach
      - Investigate
      - Flee
      transitions:
      - order: 0
        event: SkillSucceeded
        guard: arrived_at_snapshot
        to_phase: Search
      - order: 1
        event: SkillFailed
        guard: PathUnavailable
        terminal: Failed
      - order: 2
        event: SightAcquired
        guard: subject_identified
        to_phase: Resolve
      - order: 3
        event: Timeout
        guard: phase_timeout
        terminal: Failed
    Search:
      allowed_skills:
      - ContinueCurrentAction
      - SearchArea
      - LookAt
      - TurnTo
      transitions:
      - order: 0
        event: SightAcquired
        guard: subject_identified
        to_phase: Resolve
      - order: 1
        event: SkillSucceeded
        guard: search_budget_exhausted
        to_phase: Return
      - order: 2
        event: Timeout
        guard: phase_timeout
        to_phase: Return
    Resolve:
      allowed_skills:
      - ContinueCurrentAction
      - Greet
      - Warn
      - CallForHelp
      - Attack
      - Flee
      transitions:
      - order: 0
        event: SkillSucceeded
        guard: resolution_complete
        to_phase: Return
      - order: 1
        event: TargetInvalidated
        guard: no_valid_belief
        to_phase: Search
    Return:
      allowed_skills:
      - ContinueCurrentAction
      - Approach
      - Idle
      transitions:
      - order: 0
        event: SkillSucceeded
        guard: at_return_target
        terminal: Succeeded
      - order: 1
        event: SkillFailed
        guard: PathUnavailable
        terminal: Failed
- id: 3
  name: EnforceBoundary
  status: v1
  default_priority: 160
  source_priority: Quest
  interruptibility: PhaseBoundary
  resume_policy: ResumeSamePhase
  initial_phase: Observe
  phases:
    Observe:
      allowed_skills:
      - Idle
      - ContinueCurrentAction
      - LookAt
      - TurnTo
      transitions:
      - order: 0
        event: SightAcquired
        guard: boundary_intruder_is_primary_social_subject
        to_phase: Interact
      - order: 1
        event: TargetInvalidated
        guard: no_boundary_intruder
        to_phase: Return
      - order: 2
        event: Timeout
        guard: phase_timeout
        terminal: Failed
    Interact:
      allowed_skills:
      - ContinueCurrentAction
      - LookAt
      - TurnTo
      - Greet
      - Warn
      transitions:
      - order: 0
        event: WarningIssued
        guard: warning_delivered
        to_phase: Resolve
      - order: 1
        event: SkillSucceeded
        guard: subject_complied_before_warning
        to_phase: Return
      - order: 2
        event: TargetInvalidated
        guard: subject_left_boundary
        to_phase: Return
      - order: 3
        event: Timeout
        guard: phase_timeout
        to_phase: Resolve
    Resolve:
      allowed_skills:
      - ContinueCurrentAction
      - Warn
      - KeepDistance
      - CallForHelp
      - Attack
      - Flee
      transitions:
      - order: 0
        event: SkillSucceeded
        guard: boundary_resolved
        to_phase: Return
      - order: 1
        event: WarningIgnored
        guard: escalation_allowed
        to_phase: Resolve
        effect: remain_and_replan
      - order: 2
        event: Damaged
        guard: combat_goal_allowed
        to_goal: CombatEngage
        effect: request_new_goal
      - order: 3
        event: TargetInvalidated
        guard: subject_no_longer_relevant
        to_phase: Return
    Return:
      allowed_skills:
      - ContinueCurrentAction
      - Approach
      - Idle
      transitions:
      - order: 0
        event: SkillSucceeded
        guard: at_return_target
        terminal: Succeeded
      - order: 1
        event: SkillFailed
        guard: PathUnavailable
        terminal: Failed
- id: 4
  name: CombatEngage
  status: v1
  default_priority: 220
  source_priority: Combat
  interruptibility: EmergencyOnly
  resume_policy: RestartPhase
  initial_phase: Orient
  phases:
    Orient:
      allowed_skills:
      - ContinueCurrentAction
      - LookAt
      - TurnTo
      - TakeCover
      transitions:
      - order: 0
        event: SkillSucceeded
        guard: combat_target_aligned
        to_phase: Resolve
      - order: 1
        event: SightLost
        guard: has_last_known_position
        to_phase: Search
      - order: 2
        event: TargetInvalidated
        guard: no_valid_combat_target
        to_phase: Return
    Resolve:
      allowed_skills:
      - ContinueCurrentAction
      - Attack
      - TakeCover
      - RetreatFrom
      - CallForHelp
      - Flee
      transitions:
      - order: 0
        event: SightLost
        guard: has_last_known_position
        to_phase: Search
      - order: 1
        event: SkillSucceeded
        guard: combat_resolved
        to_phase: Return
      - order: 2
        event: TargetInvalidated
        guard: combat_target_invalid
        to_phase: Return
      - order: 3
        event: ReservationLost
        guard: cover_resource_lost
        to_phase: Resolve
        effect: remain_and_replan
    Search:
      allowed_skills:
      - ContinueCurrentAction
      - Investigate
      - SearchArea
      - LookAt
      - TurnTo
      transitions:
      - order: 0
        event: SightAcquired
        guard: combat_target_reacquired
        to_phase: Resolve
      - order: 1
        event: SkillSucceeded
        guard: search_budget_exhausted
        to_phase: Return
      - order: 2
        event: Timeout
        guard: phase_timeout
        to_phase: Return
    Return:
      allowed_skills:
      - ContinueCurrentAction
      - Approach
      - Idle
      - TakeCover
      transitions:
      - order: 0
        event: SkillSucceeded
        guard: combat_exit_complete
        terminal: Succeeded
      - order: 1
        event: SkillFailed
        guard: PathUnavailable
        terminal: Failed
- id: 5
  name: Disengage
  status: deferred_post_v1
- id: 6
  name: Escort
  status: deferred_post_v1
- id: 7
  name: Reserved
  status: reserved
v1_product_scope:
  exact_goal_names:
  - IdleObserve
  - InvestigateDisturbance
  - EnforceBoundary
  - CombatEngage
  deferred_goal_names:
  - Disengage
  - Escort
  reserved_goal_names:
  - Reserved
primary_social_subject_selection:
  max_primary_subjects: 1
  eligible_target_kind: Entity
  requires_identity_confidence_q_min: 500
  selection_key:
  - field: active_dialogue_subject
    direction: desc
    dtype: bool
  - field: active_goal_primary_target
    direction: desc
    dtype: bool
  - field: visible_now
    direction: desc
    dtype: bool
  - field: identity_confidence_q
    direction: desc
    dtype: uint16
  - field: belief_age_q
    direction: asc
    dtype: uint16
  - field: distance_q
    direction: asc
    dtype: uint16
  - field: stable_id
    direction: asc
    dtype: uint64
  - field: generation
    direction: asc
    dtype: uint32
  raw_float_sorting_forbidden: true
  slot_reordering_does_not_change_subject_identity: true
