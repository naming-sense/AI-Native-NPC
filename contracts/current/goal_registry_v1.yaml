        to_phase: Interact
      - order: 1
        trigger:
          kind: event
          event_type: TargetInvalidated
        guard: no_boundary_intruder
        to_phase: Return
      - order: 2
        trigger:
          kind: timer
          timer_id: phase_timeout
          after_seconds: 4.0
        guard: phase_timeout
        terminal: Failed
    Interact:
      allowed_skills:
      - ContinueCurrentAction
      - LookAt
      - TurnTo
      - Greet
      - Warn
      transitions:
      - order: 0
        trigger:
          kind: event
          event_type: WarningIssued
        guard: warning_delivered
        to_phase: Resolve
      - order: 1
        trigger:
          kind: event
          event_type: SkillSucceeded
        guard: subject_complied_before_warning
        to_phase: Return
      - order: 2
        trigger:
          kind: event
          event_type: TargetInvalidated
        guard: subject_left_boundary
        to_phase: Return
      - order: 3
        trigger:
          kind: timer
          timer_id: phase_timeout
          after_seconds: 6.0
        guard: phase_timeout
        to_phase: Resolve
    Resolve:
      allowed_skills:
      - ContinueCurrentAction
      - Warn
      - KeepDistance
      - CallForHelp
      - Attack
      - Flee
