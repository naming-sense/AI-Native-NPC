- id: 4
  name: CombatEngage
  status: v1
  default_priority: 220
  source_priority: Combat
  interruptibility: EmergencyOnly
  resume_policy: RestartPhase
  initial_phase: Orient
  phases:
    Orient:
      allowed_skills:
      - ContinueCurrentAction
      - LookAt
      - TurnTo
      - TakeCover
      transitions:
      - order: 0
        trigger:
          kind: event
          event_type: SkillSucceeded
        guard: combat_target_aligned
        to_phase: Resolve
      - order: 1
        trigger:
          kind: event
          event_type: SightLost
        guard: has_last_known_position
        to_phase: Search
      - order: 2
        trigger:
          kind: event
          event_type: TargetInvalidated
        guard: no_valid_combat_target
        to_phase: Return
    Resolve:
      allowed_skills:
      - ContinueCurrentAction
      - Attack
      - TakeCover
      - RetreatFrom
      - CallForHelp
      - Flee
      transitions:
      - order: 0
        trigger:
          kind: event
          event_type: SightLost
        guard: has_last_known_position
        to_phase: Search
      - order: 1
        trigger:
          kind: event
          event_type: SkillSucceeded
        guard: combat_resolved
        to_phase: Return
      - order: 2
        trigger:
          kind: event
          event_type: TargetInvalidated
        guard: combat_target_invalid
        to_phase: Return
      - order: 3
        trigger:
          kind: event
