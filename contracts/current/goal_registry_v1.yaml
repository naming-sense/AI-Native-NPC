          kind: event
          event_type: SkillSucceeded
        guard: boundary_resolved
        to_phase: Return
      - order: 1
        trigger:
          kind: event
          event_type: WarningIgnored
        guard: escalation_allowed
        to_phase: Resolve
        effect: remain_and_replan
      - order: 2
        trigger:
          kind: event
          event_type: Damaged
        guard: combat_goal_allowed
        to_goal: CombatEngage
        effect: request_new_goal
      - order: 3
        trigger:
          kind: event
          event_type: TargetInvalidated
        guard: subject_no_longer_relevant
        to_phase: Return
    Return:
      allowed_skills:
